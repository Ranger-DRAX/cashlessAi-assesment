services:
  postgres:
    image: postgres:16-alpine
    container_name: cashless_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashless_wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cashless_wallet" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  web:
    build: .
    container_name: cashless_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_SECRET_KEY: "docker-insecure-dev-secret-key-change-in-production"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "cashless_wallet"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
